[project]
name = "mc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mc-shared",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
]

[tool.uv.sources]
mc-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
