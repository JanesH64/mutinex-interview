[project]
name = "mission-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mc-api", "mc-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mc-shared = { workspace = true }
mc-api = { workspace = true }
mc-cli = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff>=0.17.0"]

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = ["e2e: starts uvicorn and runs the mc CLI as a subprocess"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["mc_api", "mc_cli", "mc_shared"]
